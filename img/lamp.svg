<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <defs>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a3d2f"/>
      <stop offset="0.5" stop-color="#0d2419"/>
      <stop offset="1" stop-color="#061410"/>
    </linearGradient>

    <linearGradient id="glassGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8fff8" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#00ffb2" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#00c896" stop-opacity="0.6"/>
    </linearGradient>

    <radialGradient id="lightGlow" cx="50%" cy="50%">
      <stop offset="0" stop-color="#00ffb2" stop-opacity="0.9"/>
      <stop offset="0.5" stop-color="#00c896" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#00c896" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edgeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ffb2"/>
      <stop offset="0.5" stop-color="#00c896"/>
      <stop offset="1" stop-color="#00ffb2"/>
    </linearGradient>

    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6"/>
      <feOffset dx="0" dy="8"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.5"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glowFilter" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Световой ореол -->
  <ellipse cx="200" cy="230" rx="150" ry="120" fill="url(#lightGlow)" opacity="0.7"/>

  <!-- Крепление сверху -->
  <rect x="180" y="60" width="40" height="30" rx="4" fill="#0d2419" stroke="#00c896" stroke-width="1.5"/>
  <rect x="170" y="50" width="60" height="14" rx="3" fill="#1a3d2f" stroke="#00c896" stroke-width="1.5"/>
  <circle cx="200" cy="57" r="3" fill="#00ffb2"/>

  <!-- Кронштейн -->
  <path d="M 200 88 Q 200 110 200 130" stroke="#00c896" stroke-width="4" stroke-linecap="round"/>

  <!-- Корпус светильника -->
  <g filter="url(#softShadow)">
    <!-- Основной корпус -->
    <path d="M 90 140 Q 90 130 100 130 L 300 130 Q 310 130 310 140 L 320 210 Q 320 220 310 220 L 90 220 Q 80 220 80 210 Z"
          fill="url(#bodyGrad)" stroke="url(#edgeGrad)" stroke-width="2"/>

    <!-- Рёбра охлаждения -->
    <line x1="105" y1="140" x2="105" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="125" y1="140" x2="125" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="145" y1="140" x2="145" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="165" y1="140" x2="165" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="185" y1="140" x2="185" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="205" y1="140" x2="205" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="225" y1="140" x2="225" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="245" y1="140" x2="245" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="265" y1="140" x2="265" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>
    <line x1="285" y1="140" x2="285" y2="210" stroke="#00c896" stroke-width="1" opacity="0.4"/>

    <!-- Декоративная полоса -->
    <rect x="90" y="160" width="220" height="3" fill="#00ffb2" opacity="0.3"/>
  </g>

  <!-- Стеклянная панель (светится) -->
  <g filter="url(#glowFilter)">
    <rect x="95" y="225" width="210" height="50" rx="6" fill="url(#glassGrad)"/>
  </g>

  <!-- LED-точки внутри панели -->
  <circle cx="120" cy="250" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="150" cy="250" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="180" cy="250" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="210" cy="250" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="240" cy="250" r="4" fill="#ffffff" opacity="0.9"/>
  <circle cx="270" cy="250" r="4" fill="#ffffff" opacity="0.9"/>

  <!-- Отражение на стекле -->
  <path d="M 100 230 L 300 230 L 295 240 L 105 240 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Нижняя рамка -->
  <rect x="90" y="275" width="220" height="8" rx="2" fill="#0d2419" stroke="#00c896" stroke-width="1"/>

  <!-- Световой конус вниз -->
  <path d="M 100 285 L 300 285 L 340 400 L 60 400 Z" fill="url(#lightGlow)" opacity="0.35"/>

  <!-- Точки-искры -->
  <circle cx="140" cy="330" r="2" fill="#00ffb2" opacity="0.6"/>
  <circle cx="260" cy="350" r="2" fill="#00ffb2" opacity="0.6"/>
  <circle cx="200" cy="370" r="2" fill="#00ffb2" opacity="0.6"/>
  <circle cx="170" cy="390" r="1.5" fill="#00ffb2" opacity="0.4"/>
  <circle cx="230" cy="385" r="1.5" fill="#00ffb2" opacity="0.4"/>
</svg>